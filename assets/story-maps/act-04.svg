<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" class="story-map-svg" id="map-4-root" role="group" aria-labelledby="map-4-title map-4-desc"><title id="map-4-title">第4幕 · 庄园院落与花园平面图</title><desc id="map-4-desc">约720 m²。玻璃温室、东侧树篱径、宅后石台、园务小院、西侧步道、仪式草坪、北门与外径。选取房间查看空间说明。建筑门洞及楼梯均已标示，户型供KP描述场景。</desc><defs><pattern id="map-4-grid-garden" width="20" height="20" patternUnits="userSpaceOnUse" x="150" y="154"><path d="M20 0H0V20" fill="none" stroke="#8b9992" stroke-width=".7"/></pattern></defs><style>#map-4-root{font-family:"Noto Serif SC","Songti SC","SimSun",serif;background:#111315;color:#c7cac7}#map-4-root text{fill:#c9cecb;stroke:none;user-select:none}#map-4-root .headline{font-size:25px;letter-spacing:4px}#map-4-root .subhead{fill:#85928e;font-size:11px;letter-spacing:2px}#map-4-root .floor-title{font-size:12px;letter-spacing:2px;fill:#aab8b1}#map-4-root .wall-shadow{fill:none;stroke:#383d3d;stroke-width:.27}#map-4-root .wall{fill:none;stroke:#b5bab8;stroke-width:.105}#map-4-root .outer{stroke-width:.17;stroke:#c4c7c3}#map-4-root .floor-grid{opacity:.2}#map-4-root .room-zone{outline:none;cursor:pointer}#map-4-root .room-floor{fill:#b2c4bb;fill-opacity:.015;stroke:none}#map-4-root .room-zone:hover .room-floor,#map-4-root .room-zone:focus .room-floor{fill:#b1bdb5;fill-opacity:.12}#map-4-root .room-zone.is-selected .room-floor{fill:#a63847;fill-opacity:.23}#map-4-root .room-label{font-size:16px;letter-spacing:1.4px;pointer-events:none}#map-4-root .room-number{font:10px Georgia,serif;letter-spacing:2px;fill:#7b9188;pointer-events:none}#map-4-root .room-zone.is-selected .room-label{fill:#eee5da}#map-4-root .room-zone.is-selected .room-number{fill:#c66b75}#map-4-root .furniture{fill:none;stroke:#8c9691;stroke-width:.04;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}#map-4-root .rug{fill:none;stroke:#65786d;stroke-width:.025;stroke-dasharray:.13 .07;pointer-events:none}#map-4-root .door-gap{stroke:#111315;stroke-width:.35;fill:none}#map-4-root .doo