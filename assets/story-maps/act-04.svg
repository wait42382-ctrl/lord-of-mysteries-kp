</style><rect x="0" y="0" width="900" height="740" fill="#111315"/><g class="map-sheet-header"><path class="thin-rule" d="M38 110H862M38 651H862"/><text class="subhead" x="44" y="38">BACKLUND · SURVEY RECORD / 04</text><text class="headline" x="44" y="75">庄园院落与花园</text><text class="subhead" x="45" y="97">夜色中的降临仪式 · 约720 m²</text><g class="north-arrow" aria-label="北向下" transform="translate(838 63)"><path d="M0 -18V20M-6 9L0 20L6 9M-15 -4H15"/><path d="M0 20L-4 10H0Z" fill="#a8b9ad"/><text class="north-label" x="0" y="38" text-anchor="middle">N</text></g></g><text class="floor-title" x="150" y="124">庄园后园 / MANOR GARDEN</text><rect x="150" y="154" width="600" height="480" fill="#111315"/><rect class="floor-grid" x="150" y="154" width="600" height="480" fill="url(#map-4-grid-garden)"/><g class="room-zone" data-room="glasshouse" tabindex="0" role="button" aria-label="玻璃温室：砖基与玻璃框架的小温室，内部为花架和中央过道；北门通东侧树篱径。"><rect class="room-floor" x="153" y="157" width="154" height="134"/><text class="room-number" x="230" y="162" text-anchor="middle">01</text><text class="room-label" x="230" y="178" text-anchor="middle">玻璃温室</text></g><g class="room-zone" data-room="east-hedge-walk" tabindex="0" role="button" aria-label="东侧树篱径：修剪树篱、石径与长凳；南接温室，向西有两处开口连中央草坪和北门区。"><rect class="room-floor" x="153" y="297" width="154" height="334"/><text class="room-number" x="230" y="305" text-anchor="middle">02</text><text class="room-label" x="230" y="321" text-anchor="middle">东侧树篱径</text></g><g class="room-zone" data-room="terrace" tabindex="0" role="button" aria-label="宅后石台：顶部为第三幕宅邸的北侧后门，石阶下接草坪；左右各有通往温室区和园务小院的通路。"><rect class="room-floor" x="313" y="157" width="274" height="94"/><text class="room-number" x="450" y="164" text-anchor="middle">03</text><text class="room-label" x="450" y="180" text-anchor="middle">宅后石台</text></g><g class="room-zone" data-room="service-court" tabindex="0" role="button" aria-label="园务小院：石铺地、木质园务棚与堆放园具的边台；东接宅后石台，北接西侧步道。"><rect class="room-floor" x="593" y="157" width="154" heigh